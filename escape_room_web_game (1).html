<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上密室逃脫遊戲 - Escape Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d0f12;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .font-digital {
      font-family: 'Orbitron', monospace;
    }

    /* Aspect Ratio Container for Main Canvas */
    #game-wrapper {
      width: 100%;
      max-width: 960px;
      height: auto;
      aspect-ratio: 16 / 9;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(243, 156, 18, 0.15);
    }

    /* 2. 四向場景背景 View */
    .scene-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.35s ease-in-out;
      pointer-events: none;
    }

    .scene-view.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Hotspot Highlights for Easy Interactivity */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0);
    }

    .hotspot:hover {
      background: rgba(243, 156, 18, 0.2);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
      border: 2px dashed rgba(255, 255, 255, 0.8);
    }

    /* 北方熱點 */
    #hotspot-door { top: 18%; left: 63%; width: 26%; height: 74%; }
    #hotspot-window { top: 18%; left: 13%; width: 34%; height: 54%; }

    /* 東方熱點 */
    #hotspot-backpack { top: 40%; left: 16%; width: 22%; height: 46%; }
    #hotspot-orange-box { top: 48%; left: 57%; width: 27%; height: 38%; }

    /* 西方熱點 */
    #hotspot-doodle { top: 68%; left: 13%; width: 23%; height: 22%; }
    #hotspot-safe { top: 37%; left: 60%; width: 23%; height: 41%; }

    /* 南方熱點 */
    #hotspot-calendar { top: 11%; left: 74%; width: 16%; height: 39%; }
    #hotspot-book { top: 55%; left: 43%; width: 16%; height: 22%; }
    #hotspot-frame { top: 13%; left: 12%; width: 23%; height: 52%; }

    /* Keypad Panel styling */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* Glassmorphism modals */
    .modal-glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Scrollbar for Inventory/Logs if expanded */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: #f39c12;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-2 sm:p-6 bg-slate-950">

  <script>
    // Four Direction Configuration
    const directions = [
      { id: 'view-north', name: '北方 VIEW' },
      { id: 'view-east',  name: '東方 VIEW' },
      { id: 'view-south', name: '南方 VIEW' },
      { id: 'view-west',  name: '西方 VIEW' }
    ];
    let currentDirIndex = 0;

    // Puzzle State Controls
    let isDoorUnlocked = false;
    let isFrameUnlocked = false;
    let isSafeUnlocked = false;
    let isBackpackUnlocked = false;
    let isOrangeBoxUnlocked = false;

    // Pencil Collection Counter
    let collectedPencils = 0;

    // Draggable Panel State
    let currentLockTarget = null;
    let currentInputPassword = "";
    let maxPassLength = 4;

    // Correct Passwords Registry
    const PASSWORDS = {
      door: "4765",
      frame: "705",
      safe: "3742",
      backpack: "319",
      orangeBox: "6928"
    };

    // Text To Speech Utility (Web Speech API)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop any ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Audio Feedback Generator (Web Audio API)
    function playSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.setValueAtTime(130, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {
        console.warn("Audio Synthesis blocked or not supported:", e);
      }
    }

    // Inventory Progress Updater
    function addPencil() {
      collectedPencils++;
      document.getElementById('pencil-count').innerText = `${collectedPencils} / 4`;
      speakText("獲得鉛筆！");
    }

    // Scene Navigation
    function updateScene() {
      directions.forEach((dir, index) => {
        const viewEl = document.getElementById(dir.id);
        if (index === currentDirIndex) {
          viewEl.classList.add('active');
        } else {
          viewEl.classList.remove('active');
        }
      });
      document.getElementById('direction-text').innerText = directions[currentDirIndex].name;
      playSound('click');
    }

    function rotateLeft() {
      currentDirIndex = (currentDirIndex - 1 + directions.length) % directions.length;
      updateScene();
    }
    function rotateRight() {
      currentDirIndex = (currentDirIndex + 1) % directions.length;
      updateScene();
    }
    function rotateBack() {
      currentDirIndex = (currentDirIndex + 2) % directions.length;
      updateScene();
    }

    // Northern View Interactions
    function openDoorLockView() {
      if (isDoorUnlocked) {
        document.getElementById('complete-modal').style.display = 'flex';
        return;
      }
      document.getElementById('view-door-close-up').style.display = 'block';
      openDragLockPanel('door', '大門密碼鎖', 4);
    }

    function closeDoorLockView() {
      document.getElementById('view-door-close-up').style.display = 'none';
      closeDragLockPanel();
    }

    function openWindowView() {
      document.getElementById('view-window-close-up').style.display = 'block';
      playSound('click');
    }

    function closeWindowView() {
      document.getElementById('view-window-close-up').style.display = 'none';
      playSound('click');
    }

    // Southern Picture Frame Custom Overlay
    let frameInput = "";
    function openFrameView() {
      openPopup('popup-frame');
      if (isFrameUnlocked) {
        document.getElementById('img-frame').src = 'item_pencil_frame.png';
        document.getElementById('frame-keypad-overlay').style.display = 'none';
      } else {
        document.getElementById('img-frame').src = 'puzzle_frame_locked.png';
        document.getElementById('frame-keypad-overlay').style.display = 'block';
        frameInput = "";
        updateFrameDisplay();
      }
    }

    function pressFrameKey(key) {
      playSound('click');
      if (key === 'CLR') {
        frameInput = "";
      } else {
        if (frameInput.length < 3) frameInput += key;
      }

      updateFrameDisplay();

      if (frameInput.length === 3) {
        if (frameInput === PASSWORDS.frame) {
          playSound('success');
          isFrameUnlocked = true;
          document.getElementById('img-frame').src = 'item_pencil_frame.png';
          document.getElementById('frame-keypad-overlay').style.display = 'none';
          addPencil();
        } else {
          playSound('error');
          document.getElementById('frame-display').innerText = "ERR";
          setTimeout(() => {
            frameInput = "";
            updateFrameDisplay();
          }, 800);
        }
      }
    }

    function updateFrameDisplay() {
      const disp = document.getElementById('frame-display');
      disp.innerText = frameInput.padEnd(3, '_');
    }

    // Western Safe Inspections
    function openSafeView() {
      openPopup('popup-safe');
      if (isSafeUnlocked) {
        document.getElementById('img-safe').src = 'item_safe_opened.png';
      } else {
        document.getElementById('img-safe').src = 'puzzle_safe_locked.png';
        openDragLockPanel('safe', '保險箱密碼鎖', 4);
      }
    }

    // Eastern Backpack Interactions
    function openBackpackView() {
      openPopup('popup-backpack');
      if (isBackpackUnlocked) {
        document.getElementById('img-backpack').src = 'item_backpack_opened.png';
      } else {
        document.getElementById('img-backpack').src = 'puzzle_backpack_locked.png';
        openDragLockPanel('backpack', '書包密碼鎖', 3);
      }
    }

    // Eastern Orange Box Interactions
    function openOrangeBoxView() {
      openPopup('popup-orange-box');
      if (isOrangeBoxUnlocked) {
        document.getElementById('img-orange-box').src = 'item_orange_box_opened.png';
      } else {
        document.getElementById('img-orange-box').src = 'puzzle_orange_box_locked.png';
        openDragLockPanel('orangeBox', '橘色箱子密碼鎖', 4);
      }
    }

    // Generic Popup Controls
    function openPopup(id) {
      document.getElementById(id).style.display = 'flex';
      playSound('click');
    }

    function closePopup(id) {
      document.getElementById(id).style.display = 'none';
      closeDragLockPanel();
      playSound('click');
    }

    // Universal Draggable Code Lock Panel Logic
    function openDragLockPanel(target, title, passLen) {
      currentLockTarget = target;
      maxPassLength = passLen;
      currentInputPassword = "";
      document.getElementById('lock-title').innerHTML = `🔒 ${title}`;
      document.getElementById('drag-lock-panel').style.display = 'flex';
      updateDragLockDisplay();
    }

    function closeDragLockPanel() {
      document.getElementById('drag-lock-panel').style.display = 'none';
      currentLockTarget = null;
    }

    function pressDragKey(key) {
      playSound('click');
      if (key === 'CLR') {
        currentInputPassword = "";
      } else if (key === 'OK') {
        checkDragPassword();
        return;
      } else {
        if (currentInputPassword.length < maxPassLength) {
          currentInputPassword += key;
        }
      }
      updateDragLockDisplay();
    }

    function updateDragLockDisplay() {
      const displayEl = document.getElementById('drag-lock-display');
      displayEl.style.color = '#34d399'; // Emerald tone
      displayEl.innerText = currentInputPassword.padEnd(maxPassLength, '_');
    }

    function checkDragPassword() {
      const displayEl = document.getElementById('drag-lock-display');
      const correctPass = PASSWORDS[currentLockTarget];

      if (currentInputPassword === correctPass) {
        playSound('success');
        
        if (currentLockTarget === 'door') {
          isDoorUnlocked = true;
          document.getElementById('view-north').style.backgroundImage = "url('bg_north_open.png')";
          closeDragLockPanel();
          closeDoorLockView();
          setTimeout(() => {
            document.getElementById('complete-modal').style.display = 'flex';
          }, 300);
        } else if (currentLockTarget === 'safe') {
          isSafeUnlocked = true;
          document.getElementById('img-safe').src = 'item_safe_opened.png';
          closeDragLockPanel();
          addPencil();
        } else if (currentLockTarget === 'backpack') {
          isBackpackUnlocked = true;
          document.getElementById('img-backpack').src = 'item_backpack_opened.png';
          closeDragLockPanel();
          addPencil();
        } else if (currentLockTarget === 'orangeBox') {
          isOrangeBoxUnlocked = true;
          document.getElementById('img-orange-box').src = 'item_orange_box_opened.png';
          closeDragLockPanel();
          addPencil();
        }
      } else {
        playSound('error');
        displayEl.style.color = '#f87171'; // Red error text
        displayEl.innerText = "ERROR";
        setTimeout(() => {
          currentInputPassword = "";
          updateDragLockDisplay();
        }, 850);
      }
    }

    // Make Lock Panel Draggable
    dragElement(document.getElementById("drag-lock-panel"));

    function dragElement(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const header = document.getElementById(elmnt.id + "-header");
      if (header) {
        header.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }
  </script>
</body>
</html>
